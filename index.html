<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For My Universe</title>
    
    <!-- Elegant and soft fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Lora:ital,wght@0,400;1,400&display=swap" rel="stylesheet">

    <style>
        /* --- RESET & SETUP --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            /* A deep, calming, romantic midnight blue gradient */
            background: linear-gradient(135deg, #070913 0%, #121026 50%, #1a1525 100%);
            font-family: 'Lora', serif;
        }

        /* --- THE CANVAS --- */
        #starlight {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* --- THE MESSAGE CONTENT --- */
        .message-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
            text-align: center;
            width: 90%;
            max-width: 400px;
            pointer-events: none; /* Allows her to touch the stars through the text */
        }

        /* Sequential Fade-in Animations */
        .line {
            opacity: 0;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
            margin-bottom: 1.5rem;
            transform: translateY(15px);
        }

        .line-1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            font-weight: 600;
            color: #fce7f3; /* Soft pink-white starlight */
            animation: gentleFadeIn 3s ease forwards 1s;
        }

        .line-2 {
            font-size: 1.1rem;
            font-style: italic;
            color: #cbd5e1; /* Soft muted blue-grey */
            animation: gentleFadeIn 3s ease forwards 4.5s;
        }

        .line-3 {
            font-size: 1.2rem;
            color: #e2e8f0;
            animation: gentleFadeIn 3s ease forwards 8s;
        }

        .line-4 {
            font-size: 1.2rem;
            color: #fce7f3;
            animation: gentleFadeIn 3s ease forwards 11.5s;
        }

        .line-5 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            font-weight: 600;
            color: #fbcfe8; /* Deeper soft pink */
            margin-top: 2rem;
            letter-spacing: 2px;
            animation: gentleFadeIn 3s ease forwards 15s;
        }

        @keyframes gentleFadeIn {
            0% { opacity: 0; transform: translateY(15px); }
            100% { opacity: 1; transform: translateY(0); }
        }

    </style>
</head>
<body>

    <!-- Interactive Star Canvas -->
    <canvas id="starlight"></canvas>

    <!-- The Heartfelt Message -->
    <div class="message-container">
        <div class="line line-1">Good morning, Bhura.</div>
        <div class="line line-2">I know looking at the past brought shadows...</div>
        <div class="line line-3">I can't change the history before you.</div>
        <div class="line line-4">But look at my universe right now. Every single star points to you.</div>
        <div class="line line-5">My Anushka.<br>My Present.<br>My Forever.</div>
    </div>

    <script>
        // --- CONSTELLATION LOGIC ---
        const canvas = document.getElementById('starlight');
        const ctx = canvas.getContext('2d');

        let width, height;
        let particles = [];
        // Radius determines how far the stars react to her touch
        const touchArea = { x: null, y: null, radius: 180 };

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Track touch and mouse movements seamlessly
        window.addEventListener('mousemove', (e) => {
            touchArea.x = e.x;
            touchArea.y = e.y;
        });
        window.addEventListener('touchmove', (e) => {
            touchArea.x = e.touches[0].clientX;
            touchArea.y = e.touches[0].clientY;
        });
        window.addEventListener('touchend', () => {
            touchArea.x = null;
            touchArea.y = null;
        });
        window.addEventListener('mouseout', () => {
            touchArea.x = null;
            touchArea.y = null;
        });

        // Particle Class
        class Star {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 2 + 0.5; 
                // Very slow, peaceful drift
                this.vx = (Math.random() - 0.5) * 0.3;
                this.vy = (Math.random() - 0.5) * 0.3;
                // Give some stars a slightly pinkish hue, others pure white
                this.color = Math.random() > 0.8 ? 'rgba(251, 207, 232, 0.8)' : 'rgba(255, 255, 255, 0.8)';
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.closePath();
                ctx.fill();
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                // Seamless wrap-around edges instead of hard bouncing
                if (this.x < 0) this.x = width;
                if (this.x > width) this.x = 0;
                if (this.y < 0) this.y = height;
                if (this.y > height) this.y = 0;

                // Interaction: Stars gently gravitate toward her touch
                if (touchArea.x != null) {
                    let dx = touchArea.x - this.x;
                    let dy = touchArea.y - this.y;
                    let distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance < touchArea.radius) {
                        const forceDirectionX = dx / distance;
                        const forceDirectionY = dy / distance;
                        // Soft pull
                        const force = (touchArea.radius - distance) / touchArea.radius;
                        
                        this.x += forceDirectionX * force * 1.2;
                        this.y += forceDirectionY * force * 1.2;
                    }
                }
            }
        }

        // Initialize stars
        function init() {
            particles = [];
            // Amount of stars adjusted for mobile screens to look elegant
            const numberOfParticles = (width * height) / 8000; 
            for (let i = 0; i < numberOfParticles; i++) {
                particles.push(new Star());
            }
        }

        // Connect the stars
        function connect() {
            for (let a = 0; a < particles.length; a++) {
                for (let b = a; b < particles.length; b++) {
                    let dx = particles[a].x - particles[b].x;
                    let dy = particles[a].y - particles[b].y;
                    let distance = dx * dx + dy * dy;

                    // If stars are close enough, draw a line
                    if (distance < 10000) { 
                        let opacityValue = 1 - (distance / 10000);
                        // Soft, warm starlight connecting lines
                        ctx.strokeStyle = `rgba(252, 231, 243, ${opacityValue * 0.3})`; 
                        ctx.lineWidth = 0.8;
                        ctx.beginPath();
                        ctx.moveTo(particles[a].x, particles[a].y);
                        ctx.lineTo(particles[b].x, particles[b].y);
                        ctx.stroke();
                    }
                }
            }
        }

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            // Slightly clear the canvas to create a tiny trail effect
            ctx.fillStyle = 'rgba(7, 9, 19, 0.3)';
            ctx.fillRect(0, 0, width, height);

            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
            }
            connect();
        }

        init();
        animate();
    </script>
</body>
</html>

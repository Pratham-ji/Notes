<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>I Am Sorry</title>
    
    <!-- Elegant Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">

    <style>
        /* --- RESET & SETUP --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a0b1c;
            font-family: 'Playfair Display', serif;
            color: #ffffff;
        }

        /* --- ENDLESS SHIFTING BACKGROUND --- */
        .ambient-bg {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 50% 50%, #4a154b 0%, #1a0b1c 40%, #0d040f 100%),
                        radial-gradient(circle at 80% 20%, #701a75 0%, transparent 40%),
                        radial-gradient(circle at 20% 80%, #be185d 0%, transparent 40%);
            background-size: 150% 150%;
            animation: breatheBg 20s ease-in-out infinite alternate;
            z-index: 0;
            opacity: 0.8;
        }

        @keyframes breatheBg {
            0% { transform: scale(1) rotate(0deg); }
            100% { transform: scale(1.1) rotate(5deg); }
        }

        /* --- FLOATING DUST --- */
        canvas#dust {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* --- SLIDER CONTAINER --- */
        .slider-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- THE SLIDES --- */
        .slide {
            position: absolute;
            width: 100%;
            padding: 0 2rem;
            text-align: center;
            opacity: 0;
            visibility: hidden;
            /* Cinematic slide & fade effect */
            transform: translateX(50px) scale(0.98);
            transition: all 1.5s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .slide.active {
            opacity: 1;
            visibility: visible;
            transform: translateX(0) scale(1);
        }

        .slide.exit {
            opacity: 0;
            visibility: hidden;
            transform: translateX(-50px) scale(1.02);
        }

        /* --- TYPOGRAPHY --- */
        h1 {
            font-size: clamp(3rem, 10vw, 5.5rem);
            font-weight: 500;
            line-height: 1.1;
            margin-bottom: 1.5rem;
            text-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            letter-spacing: -1px;
            color: #fdf2f8;
        }

        .highlight {
            font-style: italic;
            color: #fbcfe8;
        }

        p {
            font-family: 'Montserrat', sans-serif;
            font-size: clamp(1rem, 4vw, 1.3rem);
            font-weight: 300;
            color: #fce7f3;
            letter-spacing: 2px;
            line-height: 1.6;
            opacity: 0.9;
            max-width: 600px;
            margin: 0 auto;
        }

        /* --- PROGRESS BAR & INDICATORS --- */
        .ui-container {
            position: absolute;
            bottom: 40px;
            left: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 20;
        }

        .progress-track {
            width: 200px;
            height: 2px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            position: relative;
            overflow: hidden;
        }

        .progress-fill {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 0%;
            background: #fbcfe8;
            border-radius: 2px;
            box-shadow: 0 0 10px #fbcfe8;
        }

        .swipe-hint {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: rgba(255, 255, 255, 0.4);
            margin-top: 15px;
        }

    </style>
</head>
<body>

    <!-- Beautiful shifting background -->
    <div class="ambient-bg"></div>
    <canvas id="dust"></canvas>

    <!-- The Endless Slider -->
    <div class="slider-container" id="slider">
        <!-- Slides will be injected here via JS -->
    </div>

    <!-- UI Elements -->
    <div class="ui-container">
        <div class="progress-track">
            <div class="progress-fill" id="progress"></div>
        </div>
        <div class="swipe-hint">Swipe or Wait</div>
    </div>

    <script>
        // --- SLIDE CONTENT ---
        // A continuous, heartfelt letter broken into slides
        const slidesData = [
            { title: "I am <span class='highlight'>sorry.</span>", text: "For the moments I let you down." },
            { title: "My heart is <span class='highlight'>heavy.</span>", text: "Knowing I caused a shadow in your day." },
            { title: "I am still <span class='highlight'>learning.</span>", text: "But I am trying, every single day, for you." },
            { title: "You are my <span class='highlight'>priority.</span>", text: "And I never want to make you feel otherwise." },
            { title: "I <span class='highlight'>see</span> you.", text: "I hear you. I value every single word you say." },
            { title: "My beautiful <span class='highlight'>Bhura.</span>", text: "My Wifeyyy. My absolute everything." },
            { title: "This is <span class='highlight'>endless.</span>", text: "Just like my patience and love for you." }
        ];

        const slider = document.getElementById('slider');
        const progress = document.getElementById('progress');
        let currentIndex = 0;
        let slideElements = [];
        let autoPlayTimer;
        const slideDuration = 5000; // 5 seconds per slide
        let progressAnimation;

        // Initialize Slides
        function initSlider() {
            slidesData.forEach((data, index) => {
                const slide = document.createElement('div');
                slide.className = 'slide';
                if (index === 0) slide.classList.add('active');
                
                slide.innerHTML = `
                    <h1>${data.title}</h1>
                    <p>${data.text}</p>
                `;
                slider.appendChild(slide);
                slideElements.push(slide);
            });
            startProgress();
        }

        // Change Slide Logic
        function goToSlide(nextIndex) {
            // Remove active class and add exit class to current slide
            slideElements[currentIndex].classList.remove('active');
            slideElements[currentIndex].classList.add('exit');

            // Wait a tiny bit, then clean up the exit class so it resets position silently
            const prevIndex = currentIndex;
            setTimeout(() => {
                slideElements[prevIndex].classList.remove('exit');
            }, 1500);

            // Set new index (looping seamlessly)
            currentIndex = nextIndex;
            if (currentIndex >= slideElements.length) currentIndex = 0;
            if (currentIndex < 0) currentIndex = slideElements.length - 1;

            // Make next slide active
            slideElements[currentIndex].classList.add('active');

            // Reset and restart progress bar
            startProgress();
        }

        // Progress Bar Animation
        function startProgress() {
            // Clear existing timers
            clearTimeout(autoPlayTimer);
            if (progressAnimation) cancelAnimationFrame(progressAnimation);

            let startTime = null;
            
            function animateProgress(timestamp) {
                if (!startTime) startTime = timestamp;
                const runtime = timestamp - startTime;
                let percent = (runtime / slideDuration) * 100;
                
                if (percent >= 100) {
                    percent = 100;
                    progress.style.width = percent + '%';
                    goToSlide(currentIndex + 1); // Move to next slide automatically
                    return;
                }
                
                progress.style.width = percent + '%';
                progressAnimation = requestAnimationFrame(animateProgress);
            }
            
            progressAnimation = requestAnimationFrame(animateProgress);
        }

        // --- SWIPE (TOUCH) CONTROLS FOR MOBILE ---
        let touchStartX = 0;
        let touchEndX = 0;

        slider.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
        }, {passive: true});

        slider.addEventListener('touchend', e => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        }, {passive: true});

        // Mouse drag support for desktop testing
        let isDragging = false;
        slider.addEventListener('mousedown', e => {
            isDragging = true;
            touchStartX = e.clientX;
        });
        slider.addEventListener('mouseup', e => {
            if(!isDragging) return;
            isDragging = false;
            touchEndX = e.clientX;
            handleSwipe();
        });
        slider.addEventListener('mouseleave', () => { isDragging = false; });

        function handleSwipe() {
            const swipeThreshold = 50; // minimum distance to be considered a swipe
            if (touchEndX < touchStartX - swipeThreshold) {
                // Swiped Left -> Next Slide
                goToSlide(currentIndex + 1);
            }
            if (touchEndX > touchStartX + swipeThreshold) {
                // Swiped Right -> Previous Slide
                goToSlide(currentIndex - 1);
            }
        }

        // --- AMBIENT FLOATING DUST ---
        const canvas = document.getElementById('dust');
        const ctx = canvas.getContext('2d');
        let width, height, particles = [];

        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class DustParticle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 2 + 0.5;
                this.vx = (Math.random() - 0.5) * 0.4;
                this.vy = -(Math.random() * 0.4 + 0.1);
                this.opacity = Math.random() * 0.5 + 0.1;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(251, 207, 232, ${this.opacity})`;
                ctx.fill();
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.x += Math.sin(this.y * 0.01) * 0.2; // Soft sway
                
                if (this.y < -10) this.y = height + 10;
                if (this.x < -10) this.x = width + 10;
                if (this.x > width + 10) this.x = -10;
            }
        }

        for (let i = 0; i < 40; i++) particles.push(new DustParticle());

        function animateDust() {
            ctx.clearRect(0, 0, width, height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animateDust);
        }

        // Start Everything
        initSlider();
        animateDust();

    </script>
</body>
</html>

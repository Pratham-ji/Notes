<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For My Anushka</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Lato:wght@300;400&display=swap" rel="stylesheet">

    <style>
        /* --- RESET & SETUP --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            /* A deep, calming, ocean-to-dusk gradient. */
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #31102f 100%);
            font-family: 'Cormorant Garamond', serif;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- BACKGROUND PARTICLES --- */
        #calm-water {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* --- THE CONTENT AREA --- */
        .container {
            position: relative;
            z-index: 10;
            width: 100%; /* Changed to 100% to ensure perfect centering */
            max-width: 600px;
            text-align: center;
            padding: 0 1.5rem;
            cursor: pointer; 
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #text-container {
            position: relative;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- TYPOGRAPHY & ANIMATIONS --- */
        .affirmation {
            /* Responsive font sizing so it never breaks on mobile */
            font-size: clamp(1.6rem, 7vw, 2.2rem); 
            line-height: 1.4;
            font-weight: 500;
            color: #fdf2f8; 
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            opacity: 0;
            
            /* THIS FIXES THE SAFARI BUG */
            position: absolute;
            left: 0;
            width: 100%;
            
            transform: translateY(20px);
            transition: opacity 1.5s ease, transform 1.5s ease;
            padding: 0 1rem;
        }

        .affirmation.active {
            opacity: 1;
            transform: translateY(0);
        }

        .affirmation.fade-out {
            opacity: 0;
            transform: translateY(-20px);
        }

        .instruction {
            position: absolute;
            bottom: 40px;
            left: 0;
            width: 100%;
            text-align: center;
            font-family: 'Lato', sans-serif;
            font-size: 0.85rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #94a3b8;
            opacity: 0;
            animation: pulseFade 4s infinite 2s;
        }

        @keyframes pulseFade {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 0.8; }
        }

        /* Ambient glow when tapping */
        .tap-glow {
            position: fixed;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(244, 114, 182, 0.15) 0%, rgba(0,0,0,0) 70%);
            transform: translate(-50%, -50%) scale(0);
            pointer-events: none;
            z-index: 5;
        }

        .tap-glow.expand {
            animation: ripple 1.5s ease-out forwards;
        }

        @keyframes ripple {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(2); opacity: 0; }
        }

    </style>
</head>
<body>

    <canvas id="calm-water"></canvas>

    <div class="container" id="interaction-area">
        
        <div id="text-container"></div>

        <div class="instruction" id="instruction-text">Tap anywhere</div>
    </div>

    <script>
        const affirmations = [
            "I know you feel a little distant right now.",
            "And I just want you to know...",
            "You are completely allowed to feel whatever you are feeling.",
            "Take all the space and time you need.",
            "Because my love for you hasn't moved an inch.",
            "I am firmly planted right here, anchored to you.",
            "Even when you feel far away, you are the absolute center of my universe.",
            "Nothing you feel, and nothing we go through, changes my certainty about us.",
            "You are enough, Anushka. Exactly as you are in this very second.",
            "I choose you when we are laughing.",
            "I choose you when things are heavy.",
            "And I choose you when you feel distant.",
            "You are my Bhura.",
            "You are my safest place.",
            "And whenever you are ready to reach back out...",
            "My hand is already right here waiting for yours.",
            "I love you, Wifeyyy. Endlessly."
        ];

        let currentIndex = 0;
        let isAnimating = false;
        const textContainer = document.getElementById('text-container');
        const interactionArea = document.getElementById('interaction-area');
        const instructionText = document.getElementById('instruction-text');

        function createAffirmationElement(text) {
            const el = document.createElement('div');
            el.className = 'affirmation';
            
            if (text.includes("I choose you") || text.includes("anchored to you") || text.includes("My hand is already")) {
                el.style.fontStyle = 'italic';
            }
            if (text.includes("I love you")) {
                el.style.color = '#fbcfe8';
                // Made this responsive too so it doesn't break on small screens
                el.style.fontSize = 'clamp(2rem, 8vw, 2.8rem)';
            }
            el.innerText = text;
            return el;
        }

        let currentElement = createAffirmationElement(affirmations[0]);
        textContainer.appendChild(currentElement);
        
        setTimeout(() => {
            currentElement.classList.add('active');
        }, 500);

        interactionArea.addEventListener('click', (e) => {
            if (isAnimating) return; 

            if (currentIndex === 0) {
                instructionText.style.display = 'none';
            }

            createRipple(e.clientX, e.clientY);

            if (currentIndex >= affirmations.length - 1) return;

            isAnimating = true;

            const oldElement = currentElement;
            oldElement.classList.remove('active');
            oldElement.classList.add('fade-out');

            currentIndex++;

            const newElement = createAffirmationElement(affirmations[currentIndex]);
            textContainer.appendChild(newElement);

            setTimeout(() => {
                newElement.classList.add('active');
                currentElement = newElement;
                
                setTimeout(() => {
                    if (oldElement.parentNode) {
                        oldElement.parentNode.removeChild(oldElement);
                    }
                    isAnimating = false;
                }, 1500); 
            }, 800); 
        });

        // --- BACKGROUND AMBIENT PARTICLES ---
        const canvas = document.getElementById('calm-water');
        const ctx = canvas.getContext('2d');
        let width, height, particles = [];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class AmbientParticle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 2 + 0.5;
                this.vx = (Math.random() - 0.5) * 0.2;
                this.vy = -(Math.random() * 0.2 + 0.05); 
                this.opacity = Math.random() * 0.4 + 0.1;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(248, 250, 252, ${this.opacity})`; 
                ctx.fill();
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.x += Math.sin(this.y * 0.01) * 0.2;

                if (this.y < 0) this.y = height;
                if (this.x < 0) this.x = width;
                if (this.x > width) this.x = 0;
            }
        }

        for (let i = 0; i < 40; i++) {
            particles.push(new AmbientParticle());
        }

        function animateCanvas() {
            ctx.clearRect(0, 0, width, height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animateCanvas);
        }
        animateCanvas();

    </script>
</body>
</html>

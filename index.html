<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I Am Sorry Babu</title>
    <style>
        /* --- DARK ROOM ENVIRONMENT --- */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #030303; /* Pitch black room */
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
        }

        /* Ambient glow in the dark room casting from the screen */
        .ambient-glow {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80vw;
            height: 50vh;
            background: radial-gradient(circle, rgba(0, 255, 150, 0.08) 0%, rgba(0, 0, 0, 0) 70%);
            z-index: 0;
            pointer-events: none;
            transition: background 1s ease;
        }

        /* --- THE CSS 3D LAPTOP --- */
        .laptop-container {
            perspective: 1200px; /* Gives the 3D depth to the keyboard */
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }

        /* The Laptop Lid / Screen Bezel */
        .laptop-lid {
            width: 85vw;
            max-width: 600px;
            aspect-ratio: 16 / 10;
            background: #111;
            border-radius: 12px 12px 0 0;
            padding: 3%;
            box-shadow: 
                inset 0 2px 5px rgba(255,255,255,0.1),
                0 -5px 20px rgba(0, 0, 0, 0.8),
                0 0 50px rgba(0, 255, 0, 0.1); /* Screen bleeding light behind */
            position: relative;
            z-index: 2;
        }

        /* The Actual Glowing Screen */
        .laptop-screen {
            width: 100%;
            height: 100%;
            background: #000;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 0 20px rgba(0,0,0,1);
        }

        /* CRT Scanline Effect */
        .scanlines {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%);
            background-size: 100% 4px;
            z-index: 100;
            pointer-events: none;
        }

        /* Screen Glare */
        .glare {
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: linear-gradient(45deg, rgba(255,255,255,0) 40%, rgba(255,255,255,0.05) 50%, rgba(255,255,255,0) 60%);
            z-index: 101;
            pointer-events: none;
        }

        /* The Keyboard Base */
        .laptop-base {
            width: 95vw;
            max-width: 670px;
            height: 140px;
            background: linear-gradient(to bottom, #1a1a1a 0%, #050505 100%);
            border-radius: 4px 4px 20px 20px;
            transform: rotateX(65deg) translateY(-25px);
            transform-origin: top;
            position: relative;
            z-index: 1;
            box-shadow: 
                0 40px 50px rgba(0,0,0,0.9),
                inset 0 1px 2px rgba(255,255,255,0.1);
        }

        /* Keyboard Reflection (Light bouncing from screen) */
        .base-reflection {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(to bottom, rgba(0, 255, 0, 0.05) 0%, transparent 50%);
            border-radius: inherit;
            transition: background 1s ease;
        }

        /* Trackpad */
        .laptop-base::after {
            content: '';
            position: absolute;
            bottom: 15%;
            left: 50%;
            transform: translateX(-50%);
            width: 25%;
            height: 35%;
            background: #111;
            border-radius: 4px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5), 0 1px 1px rgba(255,255,255,0.05);
        }

        /* --- OLD SCHOOL ANIMATIONS --- */
        .slideshow-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .slide {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.5s ease;
        }

        .slide.active {
            opacity: 1;
            visibility: visible;
        }

        /* Text Styles */
        .retro-text {
            position: absolute;
            white-space: nowrap;
            font-size: clamp(2rem, 5vw, 4rem);
            font-weight: 900;
            text-transform: uppercase;
        }

        /* Animation 1: Classic Hacker Marquee */
        .anim-marquee {
            color: #00ff00;
            text-shadow: 0 0 10px #00ff00;
            top: 40%;
            animation: slideLeft 6s linear infinite;
        }

        /* Animation 2: Windows 95 Bouncing DVD style */
        .anim-bounce {
            color: #ffff00;
            text-shadow: 3px 3px 0 #ff0000;
            animation: 
                slideRight 8s linear infinite,
                bounceUp 3s ease-in-out infinite alternate;
        }

        /* Animation 3: Glitchy Cyberpunk */
        .anim-glitch {
            color: #00ffff;
            text-shadow: -2px 0 #ff00ff, 2px 0 #0000ff;
            top: 50%;
            transform: translateY(-50%);
            animation: slideLeftFast 4s linear infinite;
        }

        /* Keyframes */
        @keyframes slideLeft {
            0% { left: 100%; }
            100% { left: -100%; }
        }

        @keyframes slideLeftFast {
            0% { left: 100%; }
            100% { left: -150%; }
        }

        @keyframes slideRight {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        @keyframes bounceUp {
            0% { top: 10%; }
            100% { top: 70%; }
        }

    </style>
</head>
<body>

    <!-- Light cast onto the wall behind the laptop -->
    <div class="ambient-glow" id="ambient-glow"></div>

    <div class="laptop-container">
        <!-- The Screen -->
        <div class="laptop-lid" id="laptop-lid">
            <div class="laptop-screen">
                <div class="scanlines"></div>
                <div class="glare"></div>
                
                <div class="slideshow-container">
                    <!-- Slide 1: Matrix / Hacker Style -->
                    <div class="slide active" data-color="rgba(0, 255, 0, 0.15)">
                        <div class="retro-text anim-marquee">I am sorry babu!</div>
                    </div>
                    
                    <!-- Slide 2: Retro Windows Bouncing Style -->
                    <div class="slide" data-color="rgba(255, 255, 0, 0.15)">
                        <div class="retro-text anim-bounce">I am sorry babu!</div>
                    </div>

                    <!-- Slide 3: 80s Cyberpunk Fast Slide -->
                    <div class="slide" data-color="rgba(0, 255, 255, 0.15)">
                        <div class="retro-text anim-glitch">I am sorry babu!</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- The Keyboard Area -->
        <div class="laptop-base">
            <div class="base-reflection" id="base-reflection"></div>
        </div>
    </div>

    <script>
        // Endless Slideshow Logic
        const slides = document.querySelectorAll('.slide');
        const ambientGlow = document.getElementById('ambient-glow');
        const lidShadow = document.getElementById('laptop-lid');
        const baseReflection = document.getElementById('base-reflection');
        
        let currentSlide = 0;

        function nextSlide() {
            // Hide current slide
            slides[currentSlide].classList.remove('active');
            
            // Move to next slide
            currentSlide = (currentSlide + 1) % slides.length;
            
            // Show new slide
            slides[currentSlide].classList.add('active');
            
            // Update the room's ambient glow to match the screen's current color
            const glowColor = slides[currentSlide].getAttribute('data-color');
            
            ambientGlow.style.background = `radial-gradient(circle, ${glowColor} 0%, rgba(0, 0, 0, 0) 70%)`;
            lidShadow.style.boxShadow = `inset 0 2px 5px rgba(255,255,255,0.1), 0 -5px 20px rgba(0, 0, 0, 0.8), 0 0 50px ${glowColor}`;
            baseReflection.style.background = `linear-gradient(to bottom, ${glowColor} 0%, transparent 50%)`;
        }

        // Change animation style every 8 seconds endlessly
        setInterval(nextSlide, 8000);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Right Now...</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Poppins:wght@300;600&display=swap" rel="stylesheet">

    <style>
        /* --- MOBILE RESET & SETUP --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden; /* Keep it contained */
            /* Dreamy pastel gradient to match the bouquet and vibe */
            background: linear-gradient(170deg, #fff5f7 0%, #ffe0e9 100%);
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- DYNAMIC BACKGROUND ELEMENTS --- */
        .bokeh-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            overflow: hidden;
        }

        .bokeh-dot {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 182, 193, 0.4);
            filter: blur(8px);
            animation: float 20s infinite linear;
            pointer-events: none;
        }

        @keyframes float {
            0% { transform: translateY(100vh) translateX(0px); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-20vh) translateX(50px); opacity: 0; }
        }

        /* Create different sizes of bokeh dots via JS or manually */
        .bokeh-dot:nth-child(1) { width: 80px; height: 80px; left: 10%; animation-duration: 25s; }
        .bokeh-dot:nth-child(2) { width: 120px; height: 120px; left: 60%; animation-duration: 18s; animation-delay: 2s; background: rgba(255, 218, 224, 0.5); }
        .bokeh-dot:nth-child(3) { width: 50px; height: 50px; left: 80%; animation-duration: 30s; animation-delay: 5s; }
        .bokeh-dot:nth-child(4) { width: 100px; height: 100px; left: 30%; animation-duration: 22s; animation-delay: 8s; background: rgba(255, 255, 255, 0.6); }

        /* --- FALLING PETALS --- */
        .petals-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        .petal {
            position: absolute;
            display: block;
            background-color: #ffb6c1; /* Light pink rose color */
            border-radius: 150% 0 150% 0;
            animation: petal-fall 10s infinite linear;
            opacity: 0.7;
        }

        @keyframes petal-fall {
            0% { top: -10%; transform: translateX(0) rotate(0deg); }
            100% { top: 110%; transform: translateX(100px) rotate(450deg); }
        }

        /* Define various petal animations and starting positions */
        .petal:nth-child(1) { left: 10%; width: 15px; height: 20px; animation-duration: 7s; animation-delay: 1s; }
        .petal:nth-child(2) { left: 30%; width: 10px; height: 15px; animation-duration: 12s; animation-delay: 3s; background-color: #ffe4e1;}
        .petal:nth-child(3) { left: 50%; width: 20px; height: 25px; animation-duration: 9s; animation-delay: 0s; }
        .petal:nth-child(4) { left: 70%; width: 12px; height: 18px; animation-duration: 15s; animation-delay: 5s; }
        .petal:nth-child(5) { left: 90%; width: 18px; height: 22px; animation-duration: 11s; animation-delay: 2s; background-color: #fffaf0;}

        /* --- THE MAIN CARD --- */
        .mobile-container {
            width: 90%;
            max-width: 380px; /* Perfect phone width */
            padding: 2.5rem 1.5rem;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 30px;
            border: 2px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 15px 35px rgba(255, 182, 193, 0.3);
            z-index: 10;
            text-align: center;
            opacity: 0;
            transform: scale(0.9);
            animation: cardPopIn 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards 0.5s;
        }

        @keyframes cardPopIn {
            to { opacity: 1; transform: scale(1); }
        }

        /* --- TYPOGRAPHY --- */
        .moment-tag {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #d81159;
            font-weight: 600;
            margin-bottom: 0.5rem;
            display: inline-block;
            opacity: 0;
            animation: fadeIn 1s ease forwards 1s;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            font-size: 2.5rem;
            color: #4A2B32;
            margin-bottom: 2rem;
            line-height: 1.2;
            opacity: 0;
            animation: fadeIn 1s ease forwards 1.3s;
        }

        h1 span.bhura {
            font-family: 'Pacifico', cursive;
            color: #d81159;
            font-size: 2.8rem;
            font-weight: 400;
            display: block;
            margin-top: 5px;
        }

        .live-description {
            position: relative;
            background: rgba(255, 255, 255, 0.5);
            padding: 1.5rem;
            border-radius: 20px;
            margin-bottom: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.5);
            opacity: 0;
            animation: fadeIn 1s ease forwards 2s;
        }

        .live-description::before {
            content: '“';
            position: absolute;
            top: -10px;
            left: 10px;
            font-family: serif;
            font-size: 4rem;
            color: rgba(216, 17, 89, 0.2);
            line-height: 1;
        }

        .report-text {
            font-family: 'Lora', serif;
            font-style: italic;
            font-size: 1.1rem;
            color: #4A2B32;
            margin-bottom: 0.5rem;
        }

        .patham-text {
            color: #8f2d56;
            font-weight: 600;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .final-promise {
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            color: #d81159;
            font-weight: 700;
            font-style: italic;
            margin-bottom: 1rem;
            opacity: 0;
            animation: fadeIn 1s ease forwards 3s;
        }

        .emoji-line {
            font-size: 2rem;
            margin-top: 1rem;
            opacity: 0;
            animation: fadeIn 1s ease forwards 3.5s;
        }

        @keyframes fadeIn {
            to { opacity: 1; transform: translateY(0); }
        }

        /* Pulse animation for the paths-text */
        .pulse {
            display: inline-block;
            animation: pulse-red 2s infinite;
        }

        @keyframes pulse-red {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }

    </style>
</head>
<body>

    <div class="bokeh-bg">
        <div class="bokeh-dot"></div>
        <div class="bokeh-dot"></div>
        <div class="bokeh-dot"></div>
        <div class="bokeh-dot"></div>
    </div>

    <div class="petals-container">
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
    </div>

    <div class="mobile-container">
        <span class="moment-tag">Captured Moment</span>
        
        <h1>Right Now, <span class="bhura">My Bhura</span></h1>
        
        <div class="live-description">
            <p class="report-text">Is writing my report... 📝</p>
            <p class="patham-text">with that <span class="pulse">cute patham wala face</span> ❤️</p>
        </div>

        <p class="final-promise">I swear, you are the absolute best.</p>
        
        <div class="emoji-line">
            🌸🥺🧸💍
        </div>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For My Anushka</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">

    <style>
        /* --- RESET & SETUP --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Cormorant Garamond', serif;
            color: #f8fafc;
            background-color: #0f172a;
        }

        /* --- DYNAMIC AURORA BACKGROUND --- */
        .aurora-bg {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                45deg, 
                #0f172a 0%, 
                #2e1065 25%, 
                #31102f 50%, 
                #1e1b4b 75%, 
                #0f172a 100%
            );
            background-size: 400% 400%;
            animation: shiftAurora 20s ease-in-out infinite;
            z-index: 0;
        }

        @keyframes shiftAurora {
            0% { background-position: 0% 50%; transform: rotate(0deg); }
            50% { background-position: 100% 50%; transform: rotate(5deg); }
            100% { background-position: 0% 50%; transform: rotate(0deg); }
        }

        /* --- BACKGROUND PARTICLES --- */
        #calm-water {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* --- THE CONTENT AREA --- */
        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        #text-container {
            position: relative;
            width: 100%;
            max-width: 700px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 60vh; 
        }

        /* --- TYPOGRAPHY & ANIMATIONS --- */
        .affirmation {
            font-size: clamp(1.8rem, 7vw, 2.5rem); 
            line-height: 1.5;
            font-weight: 500;
            color: #fdf2f8; 
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            opacity: 0;
            
            position: absolute;
            left: 0;
            width: 100%;
            text-align: center;
            padding: 0 2rem;
            
            transform: translateY(30px);
            transition: opacity 1.5s ease, transform 1.5s ease;
        }

        .affirmation.active {
            opacity: 1;
            transform: translateY(0);
            animation: floatText 4s ease-in-out infinite alternate 1.5s;
        }

        .affirmation.fade-out {
            opacity: 0;
            transform: translateY(-30px);
        }

        @keyframes floatText {
            0% { transform: translateY(0px) scale(1); }
            100% { transform: translateY(-5px) scale(1.02); }
        }

        /* Ambient glow when tapping */
        .tap-glow {
            position: fixed;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(244, 114, 182, 0.2) 0%, rgba(0,0,0,0) 70%);
            transform: translate(-50%, -50%) scale(0);
            pointer-events: none;
            z-index: 5;
        }

        .tap-glow.expand {
            animation: ripple 1.2s ease-out forwards;
        }

        @keyframes ripple {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(2.5); opacity: 0; }
        }

    </style>
</head>
<body>

    <div class="aurora-bg"></div>
    <canvas id="calm-water"></canvas>

    <div class="container" id="interaction-area">
        <div id="text-container"></div>
    </div>

    <script>
        const affirmations = [
            "I know you feel a little distant right now.",
            "And I just want you to know...",
            "You are completely allowed to feel whatever you are feeling.",
            "Take all the space and time your heart needs.",
            "Because my love for you hasn't moved an inch.",
            "I am firmly planted right here, anchored to you.",
            "I don't just love you when it's easy.",
            "I love you when your mind is loud and when your heart is heavy.",
            "I love you when you're pulling away, because I know my job is to stay right here.",
            "I'll be your quiet place when the world is too much.",
            "Even when you feel far away, you are the absolute center of my universe.",
            "Nothing you feel, and nothing we go through, changes my certainty about us.",
            "You don't have to force yourself to feel 'okay' for my sake.",
            "Just exist. Just breathe. Let me do the holding for a while.",
            "You are enough, Anushka. Exactly as you are in this very second.",
            "You are my Bhura. The one I choose every single morning.",
            "You are my safest place, and I will always strive to be yours.",
            "Our future is built on an unshakable foundation.",
            "Those sleepy mornings, our chaotic kitchen, the tiny footsteps... they are all still waiting for us.",
            "Every single promise I made is still intact.",
            "No matter how far you drift, the tether between us holds strong.",
            "I am yours, completely and without condition.",
            "And whenever you are ready to reach back out...",
            "My hand is already right here waiting for yours.",
            "I love you, Wifeyyy. Endlessly."
        ];

        let currentIndex = 0;
        let isAnimating = false;
        let autoPlayTimer;
        // The time each sentence stays on screen (6 seconds)
        const readingTime = 6000; 

        const textContainer = document.getElementById('text-container');
        const interactionArea = document.getElementById('interaction-area');

        function createAffirmationElement(text) {
            const el = document.createElement('div');
            el.className = 'affirmation';
            
            if (text.includes("anchored to you") || text.includes("Let me do the holding") || text.includes("My hand is already")) {
                el.style.fontStyle = 'italic';
                el.style.color = '#fbcfe8'; 
            }
            if (text.includes("I love you, Wifeyyy")) {
                el.style.color = '#fbcfe8';
                el.style.fontSize = 'clamp(2.2rem, 9vw, 3.2rem)';
                el.style.fontStyle = 'italic';
            }
            el.innerText = text;
            return el;
        }

        let currentElement = createAffirmationElement(affirmations[0]);
        textContainer.appendChild(currentElement);
        
        // Start the automatic flow
        setTimeout(() => {
            currentElement.classList.add('active');
            startAutoPlay();
        }, 500);

        function showNextAffirmation() {
            if (isAnimating || currentIndex >= affirmations.length - 1) return;

            isAnimating = true;

            const oldElement = currentElement;
            oldElement.classList.remove('active');
            oldElement.classList.add('fade-out');

            currentIndex++;

            const newElement = createAffirmationElement(affirmations[currentIndex]);
            textContainer.appendChild(newElement);

            setTimeout(() => {
                newElement.classList.add('active');
                currentElement = newElement;
                
                setTimeout(() => {
                    if (oldElement.parentNode) {
                        oldElement.parentNode.removeChild(oldElement);
                    }
                    isAnimating = false;
                    
                    // Automatically trigger the next one if not at the end
                    if (currentIndex < affirmations.length - 1) {
                        startAutoPlay();
                    }
                }, 1500); // Wait for fade out
            }, 800); // Wait for text to swap
        }

        function startAutoPlay() {
            clearTimeout(autoPlayTimer);
            autoPlayTimer = setTimeout(showNextAffirmation, readingTime);
        }

        // Allow her to tap to speed it up if she wants
        interactionArea.addEventListener('click', (e) => {
            // Visual tap effect
            const glow = document.createElement('div');
            glow.className = 'tap-glow expand';
            glow.style.left = `${e.clientX}px`;
            glow.style.top = `${e.clientY}px`;
            document.body.appendChild(glow);
            setTimeout(() => glow.remove(), 1200);

            // Cancel the automatic timer and advance immediately
            clearTimeout(autoPlayTimer);
            showNextAffirmation();
        });

        // --- ENHANCED BACKGROUND PARTICLES ---
        const canvas = document.getElementById('calm-water');
        const ctx = canvas.getContext('2d');
        let width, height, particles = [];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class AmbientParticle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 2.5 + 0.5;
                this.vx = (Math.random() - 0.5) * 0.3;
                this.vy = -(Math.random() * 0.3 + 0.1); 
                this.opacity = Math.random() * 0.5 + 0.2;
                this.pulseSpeed = Math.random() * 0.02;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(248, 250, 252, ${this.opacity})`; 
                ctx.shadowBlur = 10;
                ctx.shadowColor = 'rgba(248, 250, 252, 0.5)';
                ctx.fill();
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.x += Math.sin(this.y * 0.02) * 0.3;
                this.opacity += Math.sin(Date.now() * this.pulseSpeed) * 0.01;

                if (this.y < -10) this.y = height + 10;
                if (this.x < -10) this.x = width + 10;
                if (this.x > width + 10) this.x = -10;
            }
        }

        for (let i = 0; i < 60; i++) {
            particles.push(new AmbientParticle());
        }

        function animateCanvas() {
            ctx.clearRect(0, 0, width, height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animateCanvas);
        }
        animateCanvas();

    </script>
</body>
</html>

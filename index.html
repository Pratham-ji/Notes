<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Good Morning, Wifeyyy</title>
    
    <!-- Soft, romantic fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Quicksand:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        /* --- RESET & SETUP --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            /* A warm, glowing "sunrise" gradient to make her feel happy and safe */
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            font-family: 'Quicksand', sans-serif;
        }

        /* --- THE CANVAS --- */
        #magic-dust {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* --- THE PSYCHOLOGICAL COPY --- */
        .message-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
            text-align: center;
            width: 90%;
            max-width: 400px;
            pointer-events: none; /* Lets her play with the magic dust */
        }

        .line {
            opacity: 0;
            color: #4A2B32;
            margin-bottom: 1.5rem;
            transform: translateY(20px);
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.6);
        }

        /* Step 1: Disarm her immediately */
        .line-1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            font-weight: 700;
            color: #d81159;
            animation: floatUp 3s ease forwards 1s;
        }

        /* Step 2: Make her the center of your universe */
        .line-2 {
            font-size: 1.2rem;
            font-weight: 500;
            animation: floatUp 3s ease forwards 4.5s;
        }

        /* Step 3: Invalidate everything else */
        .line-3 {
            font-size: 1.1rem;
            font-weight: 400;
            font-style: italic;
            animation: floatUp 3s ease forwards 8s;
        }

        /* Step 4: The physical prompt to smile */
        .line-4 {
            font-size: 1.2rem;
            font-weight: 500;
            animation: floatUp 3s ease forwards 11.5s;
        }

        /* Step 5: Reinforce the titles */
        .line-5 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            font-weight: 700;
            color: #d81159;
            margin-top: 2rem;
            animation: floatUp 3s ease forwards 15s;
        }

        @keyframes floatUp {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* Soft glowing vignette around the screen */
        .vignette {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            box-shadow: inset 0 0 100px rgba(255, 255, 255, 0.5);
            pointer-events: none;
            z-index: 5;
        }
    </style>
</head>
<body>

    <div class="vignette"></div>

    <!-- Golden Interactive Dust Canvas -->
    <canvas id="magic-dust"></canvas>

    <!-- The Text -->
    <div class="message-container">
        <div class="line line-1">Hey sleepyhead...</div>
        <div class="line line-2">I was just watching you sleep, realizing how incredibly lucky I am.</div>
        <div class="line line-3">My life didn't even truly begin until the day I met you. Everything before you was just waiting for you.</div>
        <div class="line line-4">Now, give me that cute morning smile...</div>
        <div class="line line-5">My Wifeyyy.</div>
    </div>

    <script>
        // --- GOLDEN DUST LOGIC ---
        // This is designed to be highly responsive to her touch, creating a satisfying "glow" effect
        const canvas = document.getElementById('magic-dust');
        const ctx = canvas.getContext('2d');

        let width, height;
        let particles = [];
        const touchArea = { x: null, y: null, radius: 200 };

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        window.addEventListener('mousemove', (e) => {
            touchArea.x = e.x;
            touchArea.y = e.y;
        });
        window.addEventListener('touchmove', (e) => {
            touchArea.x = e.touches[0].clientX;
            touchArea.y = e.touches[0].clientY;
        });
        window.addEventListener('touchend', () => {
            touchArea.x = null;
            touchArea.y = null;
        });

        class MagicParticle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 3 + 1; 
                this.vx = (Math.random() - 0.5) * 0.8;
                this.vy = (Math.random() - 0.5) * 0.8;
                // Golden and soft white particles
                const colors = ['rgba(255, 255, 255, 0.8)', 'rgba(255, 215, 0, 0.6)', 'rgba(255, 182, 193, 0.7)'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                if (this.x < 0 || this.x > width) this.vx = -this.vx;
                if (this.y < 0 || this.y > height) this.vy = -this.vy;

                // When she touches the screen, the golden dust swirls around her finger
                if (touchArea.x != null) {
                    let dx = touchArea.x - this.x;
                    let dy = touchArea.y - this.y;
                    let distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance < touchArea.radius) {
                        const forceDirectionX = dx / distance;
                        const forceDirectionY = dy / distance;
                        const force = (touchArea.radius - distance) / touchArea.radius;
                        
                        this.x += forceDirectionX * force * 3;
                        this.y += forceDirectionY * force * 3;
                        
                        // Particles grow slightly when touched
                        this.size = Math.min(this.size + 0.2, 5); 
                    } else {
                        // Shrink back to normal
                        this.size = Math.max(this.size - 0.1, 1);
                    }
                }
            }
        }

        function init() {
            particles = [];
            const numberOfParticles = (width * height) / 6000; 
            for (let i = 0; i < numberOfParticles; i++) {
                particles.push(new MagicParticle());
            }
        }

        function connect() {
            for (let a = 0; a < particles.length; a++) {
                for (let b = a; b < particles.length; b++) {
                    let dx = particles[a].x - particles[b].x;
                    let dy = particles[a].y - particles[b].y;
                    let distance = dx * dx + dy * dy;

                    if (distance < 8000) { 
                        let opacityValue = 1 - (distance / 8000);
                        ctx.strokeStyle = `rgba(255, 255, 255, ${opacityValue * 0.4})`; 
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(particles[a].x, particles[a].y);
                        ctx.lineTo(particles[b].x, particles[b].y);
                        ctx.stroke();
                    }
                }
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            // Clear with a very slight fade to make the particles "glow" and trail
            ctx.fillStyle = 'rgba(255, 236, 210, 0.2)';
            ctx.fillRect(0, 0, width, height);

            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
            }
            connect();
        }

        init();
        animate();
    </script>
</body>
</html>

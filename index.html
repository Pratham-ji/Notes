<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>I Love You</title>
    
    <!-- Elegant Serif and flowing Cursive fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Poppins:wght@300;400&display=swap" rel="stylesheet">

    <style>
        /* --- RESET & SETUP --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            /* A very soft, elegant romantic gradient background */
            background: radial-gradient(circle at center, #fff0f3 0%, #ffb3c6 100%);
            font-family: 'Playfair Display', serif;
        }

        /* --- THE EMOJI CANVAS --- */
        #emoji-shower {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none; /* Let touches pass to the interactive layer */
        }

        #touch-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
        }

        /* --- THE ELEGANT CENTERPIECE --- */
        .glass-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            text-align: center;
            width: 90%;
            max-width: 600px;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 4rem 2rem;
            border-radius: 40px;
            border: 2px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 30px 60px rgba(216, 17, 89, 0.15), inset 0 0 30px rgba(255, 255, 255, 0.5);
            animation: floatingCard 6s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes floatingCard {
            0%, 100% { transform: translate(-50%, -50%); }
            50% { transform: translate(-50%, -52%); }
        }

        /* --- TYPOGRAPHY --- */
        h1 {
            font-size: 3.5rem;
            color: #4A2B32;
            line-height: 1.1;
            margin-bottom: 0.5rem;
            opacity: 0;
            animation: fadeInScale 2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards 0.5s;
        }

        .wifey {
            font-family: 'Great Vibes', cursive;
            font-size: 6rem;
            color: #d81159; /* Deep romantic pink */
            display: block;
            margin-top: -10px;
            text-shadow: 0 10px 20px rgba(216, 17, 89, 0.2);
            opacity: 0;
            transform: scale(0.8);
            animation: bounceIn 2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards 1.5s;
        }

        p.sweet-note {
            font-family: 'Poppins', sans-serif;
            font-size: 1.1rem;
            color: #8f2d56;
            margin-top: 1.5rem;
            font-weight: 300;
            letter-spacing: 1px;
            line-height: 1.6;
            opacity: 0;
            animation: fadeInScale 2s ease forwards 2.5s;
        }

        .heartbeat {
            display: inline-block;
            animation: beat 1s infinite alternate;
            color: #ff0055;
            font-size: 2rem;
            margin-top: 1.5rem;
            opacity: 0;
            animation: beat 1s infinite alternate, fadeInScale 1s forwards 3.5s;
        }

        /* Keyframes */
        @keyframes fadeInScale {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes bounceIn {
            0% { opacity: 0; transform: scale(0.5); }
            60% { opacity: 1; transform: scale(1.1); }
            100% { opacity: 1; transform: scale(1); }
        }

        @keyframes beat {
            to { transform: scale(1.3); }
        }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            .glass-box { padding: 3rem 1.5rem; }
            h1 { font-size: 2.8rem; }
            .wifey { font-size: 4.5rem; margin-top: 0; }
            p.sweet-note { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <!-- Invisible layer to capture touch without blocking the card -->
    <div id="touch-layer"></div>

    <!-- The Overwhelming Emoji Canvas -->
    <canvas id="emoji-shower"></canvas>

    <!-- The Elegant Centerpiece -->
    <div class="glass-box">
        <h1>I love you,</h1>
        <span class="wifey">My Wifeyyyy</span>
        <p class="sweet-note">
            My absolute everything.<br>
            A million emojis could fill this screen,<br>
            but they still wouldn't be enough to show how much you mean to me.
        </p>
        <div class="heartbeat">❤️</div>
    </div>

    <script>
        // --- OVERWHELMING EMOJI SHOWER LOGIC ---
        const canvas = document.getElementById('emoji-shower');
        const ctx = canvas.getContext('2d');
        const touchLayer = document.getElementById('touch-layer');

        let width, height;
        let emojis = [];
        
        // A huge array of love!
        const emojiList = ['❤️', '💖', '💕', '💗', '💓', '💞', '💘', '🌸', '✨', '🧸', '🥺', '💍', '🥰', '😘'];

        const mouse = { x: null, y: null, radius: 150 };

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Track touches to make emojis "explode" away from the finger
        touchLayer.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });
        touchLayer.addEventListener('touchmove', (e) => {
            mouse.x = e.touches[0].clientX;
            mouse.y = e.touches[0].clientY;
        });
        touchLayer.addEventListener('touchend', () => {
            mouse.x = null;
            mouse.y = null;
        });
        touchLayer.addEventListener('mouseout', () => {
            mouse.x = null;
            mouse.y = null;
        });

        class FloatingEmoji {
            constructor() {
                this.reset();
                // Randomize initial Y so they start already filling the screen
                this.y = Math.random() * height; 
            }

            reset() {
                this.x = Math.random() * width;
                this.y = height + (Math.random() * 200); // Start below screen
                this.emoji = emojiList[Math.floor(Math.random() * emojiList.length)];
                
                // Mix of massive emojis and smaller ones for depth
                this.size = Math.random() * 40 + 15; 
                
                // Drift speeds
                this.vy = -(Math.random() * 2 + 1); // Floating UP
                this.vx = (Math.random() - 0.5) * 1.5; // Slight sway
                
                // Wiggle effect
                this.angle = Math.random() * Math.PI * 2;
                this.spinSpeed = (Math.random() - 0.5) * 0.05;
                
                this.opacity = Math.random() * 0.7 + 0.3;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.opacity;
                ctx.font = `${this.size}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                
                // Translate to emoji center to spin it gently
                ctx.translate(this.x, this.y);
                ctx.rotate(Math.sin(this.angle) * 0.3); // Gentle sway rotation
                
                ctx.fillText(this.emoji, 0, 0);
                ctx.restore();
            }

            update() {
                this.y += this.vy;
                this.x += this.vx + Math.sin(this.angle) * 0.5; // Swaying motion
                this.angle += this.spinSpeed;

                // INTERACTIVE: Explode away from touch
                if (mouse.x != null) {
                    let dx = this.x - mouse.x;
                    let dy = this.y - mouse.y;
                    let distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance < mouse.radius) {
                        const forceDirectionX = dx / distance;
                        const forceDirectionY = dy / distance;
                        const force = (mouse.radius - distance) / mouse.radius;
                        
                        this.x += forceDirectionX * force * 5;
                        this.y += forceDirectionY * force * 5;
                    }
                }

                // If it goes off the top, reset it to the bottom to create infinite flow
                if (this.y < -100 || this.x < -100 || this.x > width + 100) {
                    this.reset();
                    this.y = height + 50; // Reset exactly at bottom
                }
            }
        }

        // Initialize A LOT of emojis to make it look "full"
        function init() {
            emojis = [];
            // Spawn an overwhelming amount based on screen size
            const numberOfEmojis = Math.floor((width * height) / 8000); 
            for (let i = 0; i < numberOfEmojis; i++) {
                emojis.push(new FloatingEmoji());
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            ctx.clearRect(0, 0, width, height);

            for (let i = 0; i < emojis.length; i++) {
                emojis[i].update();
                emojis[i].draw();
            }
        }

        init();
        animate();
    </script>
</body>
</html>

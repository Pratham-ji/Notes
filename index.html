<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Wifeyyy</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

    <style>
        /* --- RESET & SETUP --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: linear-gradient(135deg, #090a0f 0%, #151020 100%); /* Deep magical night sky */
            font-family: 'Playfair Display', serif;
        }

        /* --- THE CANVAS --- */
        #constellation {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* --- THE TEXT CONTENT --- */
        .glass-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
            text-align: center;
            pointer-events: none; /* Lets you interact with the canvas behind the text */
            width: 100%;
            padding: 0 20px;
        }

        h1 {
            font-size: 5rem;
            color: #ffffff;
            font-weight: 400;
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.4), 0 0 40px rgba(230, 200, 255, 0.2);
            margin-bottom: 0.5rem;
            opacity: 0;
            animation: fadeIn 3s ease forwards 0.5s;
        }

        h2 {
            font-size: 2rem;
            color: #e2d1f0; /* Soft warm starlight color */
            font-weight: 400;
            font-style: italic;
            letter-spacing: 4px;
            text-shadow: 0 0 15px rgba(226, 209, 240, 0.3);
            opacity: 0;
            animation: fadeIn 3s ease forwards 2s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Mobile adjustments */
        @media (max-width: 768px) {
            h1 { font-size: 3rem; }
            h2 { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <canvas id="constellation"></canvas>

    <div class="glass-container">
        <h1>Wifeyyy</h1>
        <h2>& shivi ki mummy</h2>
    </div>

    <script>
        // --- CONSTELLATION LOGIC ---
        const canvas = document.getElementById('constellation');
        const ctx = canvas.getContext('2d');

        let width, height;
        let particles = [];
        const mouse = { x: null, y: null, radius: 150 };

        // Resize canvas to fill window
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Track mouse/touch movement
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.x;
            mouse.y = e.y;
        });
        window.addEventListener('touchmove', (e) => {
            mouse.x = e.touches[0].clientX;
            mouse.y = e.touches[0].clientY;
        });
        window.addEventListener('mouseout', () => {
            mouse.x = null;
            mouse.y = null;
        });

        // Particle (Star) Class
        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 2 + 0.5; // Star size
                this.baseX = this.x;
                this.baseY = this.y;
                this.density = (Math.random() * 30) + 1;
                // Soft drift velocity
                this.vx = (Math.random() - 0.5) * 0.5;
                this.vy = (Math.random() - 0.5) * 0.5;
            }

            draw() {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.closePath();
                ctx.fill();
            }

            update() {
                // Move the particles naturally
                this.x += this.vx;
                this.y += this.vy;

                // Bounce off edges
                if (this.x < 0 || this.x > width) this.vx = -this.vx;
                if (this.y < 0 || this.y > height) this.vy = -this.vy;

                // Mouse interaction - stars gently pull toward the cursor
                if (mouse.x != null) {
                    let dx = mouse.x - this.x;
                    let dy = mouse.y - this.y;
                    let distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance < mouse.radius) {
                        const forceDirectionX = dx / distance;
                        const forceDirectionY = dy / distance;
                        const force = (mouse.radius - distance) / mouse.radius;
                        
                        this.x += forceDirectionX * force * 1.5;
                        this.y += forceDirectionY * force * 1.5;
                    }
                }
            }
        }

        // Initialize stars
        function init() {
            particles = [];
            // Amount of stars based on screen size (keeps it elegant)
            const numberOfParticles = (width * height) / 9000; 
            for (let i = 0; i < numberOfParticles; i++) {
                particles.push(new Particle());
            }
        }

        // Draw connecting lines (The Constellation)
        function connect() {
            for (let a = 0; a < particles.length; a++) {
                for (let b = a; b < particles.length; b++) {
                    let dx = particles[a].x - particles[b].x;
                    let dy = particles[a].y - particles[b].y;
                    let distance = dx * dx + dy * dy; // avoiding Math.sqrt for performance

                    // If stars are close enough, draw a line
                    if (distance < 12000) { 
                        // Line opacity fades the further apart they are
                        let opacityValue = 1 - (distance / 12000);
                        ctx.strokeStyle = `rgba(226, 209, 240, ${opacityValue * 0.4})`; // Soft purplish-white line
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(particles[a].x, particles[a].y);
                        ctx.lineTo(particles[b].x, particles[b].y);
                        ctx.stroke();
                    }
                }
            }
        }

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            ctx.clearRect(0, 0, width, height);

            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
            }
            connect();
        }

        init();
        animate();
    </script>
</body>
</html>
